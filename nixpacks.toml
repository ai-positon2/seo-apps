[phases.setup]
# nodejs_22, not _20: the CrawlScope crawler module requires Node >= 22
# (server/modules/crawlScope). The Dockerfile already uses node:24-slim, so this
# only mattered on the nixpacks path.
nixPkgs = ["nodejs_22", "chromium", "nss", "freetype", "harfbuzz", "ca-certificates", "ttf-dejavu"]

[phases.install]
cmds = ["npm run build"]

[start]
cmd = "npm start"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/run/current-system/sw/bin/chromium"

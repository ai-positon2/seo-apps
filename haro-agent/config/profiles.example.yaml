    active: true
    priority: high

    expertise:
      primary:
        - general dentistry
        - preventive dental care
        - dental implants
        - root canal therapy
        - orthodontics
        - sleep apnea appliances
      secondary:
        - dental anxiety
        - pediatric dentistry
        - oral health and systemic health
        - dental insurance and affordability

    spokespeople:
      - name: "Dr. Alicia Monroe"
        credentials: "DMD"
        title: "Clinical Director"
        locations: ["Franklin, MA"]
        available_for: ["written Q&A", "phone interview"]

    geography:
      country: "US"
      states: ["MA", "NH"]
      accepts_national: true

    keywords_include:
      - dentist
      - dental
      - oral health
      - teeth
      - gums
      - orthodontic
      - implant
      - TMJ
      - sleep apnea
